name: Instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows-latest
            argumentos: ""
          - sistema: macos-latest
            argumentos: "--target universal-apple-darwin"
          - sistema: ubuntu-22.04
            argumentos: ""
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        if: matrix.sistema == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sistema == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Herramienta de Tauri
        run: npm install --global @tauri-apps/cli@2.9.4
      - name: Licencias de terceros
        working-directory: app
        run: |
          cargo install cargo-about --locked --version 0.8.4
          cargo about generate about.hbs -o ui/licencias.html
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: tauri
          args: ${{ matrix.argumentos }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('La Compañía {0}', github.ref_name) || '' }}
          releaseBody: "Instaladores para Windows, macOS y Linux."
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: la-compania-${{ matrix.sistema }}
          if-no-files-found: error
          path: |
            target/release/bundle/
            target/universal-apple-darwin/release/bundle/
